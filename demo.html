<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ====================
// CONFIG FIREBASE
// ====================

const firebaseConfig = {

  apiKey: "AIzaSyAHnM8CnpVjFIOhXwPSFVn9907hK7yeyNk",

  authDomain: "fir-c5cd0.firebaseapp.com",

  projectId: "fir-c5cd0",

  storageBucket: "fir-c5cd0.firebasestorage.app",

  messagingSenderId: "254512974109",

  appId: "1:254512974109:web:5c785bcb9ca151457379f4"

};


// Initialisation

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


// 1h30

const DEMO_DURATION = 90 * 60 * 1000;


const countdown = document.getElementById("countdown");

const startBtn = document.getElementById("startBtn");

const expiredBox = document.getElementById("expiredBox");


// Format heure

function format(ms){

  const total = Math.floor(ms / 1000);

  const h = Math.floor(total / 3600);

  const m = Math.floor((total % 3600) / 60);

  const s = total % 60;

  return `${h}h ${m}m ${s}s`;
}


// Démarrer le compte à rebours

let interval;

function startCountdown(startTime){

  clearInterval(interval);

  function update(){

    const remaining = startTime + DEMO_DURATION - Date.now();

    if(remaining <= 0){

      countdown.textContent = "Expiré";

      startBtn.style.display = "none";

      expiredBox.style.display = "block";

      return;
    }

    countdown.textContent = format(remaining);
  }

  update();

  interval = setInterval(update, 1000);
}


// Clic sur le bouton

startBtn.addEventListener("click", async () => {

  try {

    // Connexion Google

    const result = await signInWithPopup(auth, provider);

    const user = result.user;


    // Vérifier si l'utilisateur existe déjà

    const ref = doc(db, "demoUsers", user.uid);

    const snap = await getDoc(ref);


    // Première utilisation

    if(!snap.exists()){

      const now = Date.now();

      await setDoc(ref, {

        email: user.email,

        startTime: now,

        expiresAt: now + DEMO_DURATION

      });

      startCountdown(now);

      // Redirection vers ton vrai site

      window.location.href = "site-multichaine.html";

      return;
    }


    // Utilisateur déjà enregistré

    const data = snap.data();


    // Démo expirée

    if(Date.now() > data.expiresAt){

      countdown.textContent = "Déjà utilisée";

      startBtn.style.display = "none";

      expiredBox.style.display = "block";

      return;
    }


    // Démo encore active

    startCountdown(data.startTime);

    window.location.href = "site-multichaine.html";

  }

  catch(error){

    alert("Erreur : " + error.message);

    console.error(error);
  }

});

</script>
