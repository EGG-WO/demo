<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Channel+ Premium • Démo 1h30</title>
  <style>
    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#050816;
      color:white;
      font-family:Arial;
      padding:20px;
    }
    .box{
      max-width:520px;
      width:100%;
      background:#0f172a;
      padding:35px;
      border-radius:24px;
      text-align:center;
    }
    .btn{
      display:block;
      width:100%;
      padding:15px;
      border-radius:16px;
      text-decoration:none;
      font-weight:bold;
      margin-top:14px;
      border:none;
      cursor:pointer;
    }
    .start{
      background:#2563eb;
      color:white;
    }
    .ticket{
      background:#111827;
      color:#e2e8f0;
    }
    .timer{
      margin:20px 0;
      padding:18px;
      border-radius:18px;
      background:#020617;
    }
    .value{
      font-size:1.7rem;
      color:#22d3ee;
      font-weight:bold;
    }
    .expired{
      display:none;
      margin-top:18px;
      padding:18px;
      border-radius:18px;
      background:#331313;
      border:1px solid #7f1d1d;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>CHANNEL+ PREMIUM</h1>

  <p>
    Une seule démo gratuite de <strong>1h30</strong> est autorisée par compte Google.
  </p>

  <div class="timer">
    <div>Temps restant</div>
    <div class="value" id="countdown">Connexion requise</div>
  </div>

  <button id="startBtn" class="btn start">
    🔐 Continuer avec Google
  </button>

  <a href="https://mhoxbwqk.mychariow.shop/prd_ufg4igd1" class="btn ticket">
    🔑 Acheter un ticket premium
  </a>

  <div class="expired" id="expiredBox">
    <h2>⛔ Démo expirée</h2>
    <p>Cette démo a déjà été utilisée par ce compte Google.</p>
    <a href="https://mhoxbwqk.mychariow.shop/prd_ufg4igd1" class="btn ticket">
      🔑 Obtenir un ticket
    </a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====================
// TON CONFIG FIREBASE
// ====================
const firebaseConfig = {

    apiKey: "AIzaSyAHnM8CnpVjFIOhXwPSFVn9907hK7yeyNk",

    authDomain: "fir-c5cd0.firebaseapp.com",

    projectId: "fir-c5cd0",

    storageBucket: "fir-c5cd0.firebasestorage.app",

    messagingSenderId: "254512974109",

    appId: "1:254512974109:web:5c785bcb9ca151457379f4"

  };


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const provider = new GoogleAuthProvider();

const DEMO_DURATION = 90 * 60 * 1000; // 1h30

const countdown = document.getElementById('countdown');
const startBtn = document.getElementById('startBtn');
const expiredBox = document.getElementById('expiredBox');

function format(ms){
  const total = Math.floor(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return `${h}h ${m}m ${s}s`;
}

let interval;

function startCountdown(startTime){
  clearInterval(interval);

  function update(){
    const remaining = startTime + DEMO_DURATION - Date.now();

    if(remaining <= 0){
      countdown.textContent = 'Expiré';
      startBtn.style.display = 'none';
      expiredBox.style.display = 'block';
      return;
    }

    countdown.textContent = format(remaining);
  }

  update();
  interval = setInterval(update, 1000);
}

startBtn.addEventListener('click', async () => {
  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    const ref = doc(db, 'demoUsers', user.uid);
    const snap = await getDoc(ref);

    // Première utilisation
    if(!snap.exists()){
      const startTime = Date.now();

      await setDoc(ref, {
        email: user.email,
        startTime: startTime,
        expiresAt: startTime + DEMO_DURATION
      });

      startCountdown(startTime);

      // Redirection vers ton vrai site
      window.location.href = 'site-multichaine.html';
      return;
    }

    // Déjà utilisé
    const data = snap.data();

    if(Date.now() > data.expiresAt){
      countdown.textContent = 'Déjà utilisée';
      startBtn.style.display = 'none';
      expiredBox.style.display = 'block';
      return;
    }

    // Démo encore active
    startCountdown(data.startTime);
    window.location.href = 'site-multichaine.html';

  } catch (e) {
    alert('Erreur : ' + e.message);
    console.error(e);
  }
});
</script>

</body>
</html>
